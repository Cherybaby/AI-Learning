<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>多连杆悬架运动学反向设计演示</title>
<style>
  :root{
    --bg:#f4f6fa; --panel:#ffffff; --ink:#1f2733; --muted:#6b7686;
    --line:#e6e9f0; --accent:#e0483a; --sidebar:#eef1f7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px;
  }
  /* 顶栏 */
  .topbar{
    display:flex; align-items:center; gap:16px;
    padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:10;
  }
  .back-btn{
    border:1px solid var(--line); background:#fff; border-radius:8px;
    padding:6px 12px; color:var(--muted); cursor:pointer; font-size:13px;
  }
  .back-btn:hover{background:var(--sidebar);}
  .title{font-size:15px; font-weight:600;}
  .spacer{flex:1;}
  .status{font-size:12px; color:var(--muted);}

  .layout{display:flex; min-height:calc(100vh - 49px);}

  /* 侧栏 */
  .sidebar{
    width:250px; flex:none; background:var(--sidebar);
    border-right:1px solid var(--line); padding:20px 18px;
  }
  .sidebar h2{font-size:16px; margin:0 0 18px;}
  .ctrl{margin-bottom:22px;}
  .ctrl label{display:block; color:var(--muted); font-size:13px; margin-bottom:8px;}
  .ctrl .val{color:var(--accent); font-weight:600; text-align:center; margin-bottom:4px;}
  input[type=range]{width:100%; accent-color:var(--accent);}
  .help{
    display:inline-flex; align-items:center; justify-content:center;
    width:16px; height:16px; border-radius:50%; border:1px solid var(--muted);
    color:var(--muted); font-size:11px; cursor:help; margin-left:6px; vertical-align:middle;
  }
  .note{font-size:11px; color:var(--muted); line-height:1.5; margin-top:24px;
    border-top:1px dashed var(--line); padding-top:12px;}

  /* 主区 */
  .main{flex:1; padding:22px 26px; overflow:auto;}
  .setup-row{margin-bottom:8px;}
  select{
    width:340px; max-width:100%; padding:10px 12px; border:1px solid var(--line);
    border-radius:8px; background:#fff; font-size:14px; color:var(--ink);
  }
  .content{display:flex; gap:30px; align-items:flex-start; flex-wrap:wrap;}
  .tables{width:330px; flex:none;}
  .tables h3{font-size:20px; font-weight:700; margin:22px 0 12px; line-height:1.3;}
  table{width:100%; border-collapse:collapse; background:#fff;
    border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  th,td{padding:9px 12px; font-size:13px; border-bottom:1px solid var(--line);}
  th{background:#f7f9fc; color:var(--muted); text-align:left; font-weight:600;}
  td.name{color:var(--ink);}
  td.value{text-align:right; font-variant-numeric:tabular-nums; color:var(--ink);}
  tr:last-child td{border-bottom:none;}

  .charts{flex:1; min-width:640px;
    display:grid; grid-template-columns:repeat(3,1fr); gap:14px 18px;}
  .chart{background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 6px 4px;}
  .chart .ct{text-align:center; font-size:13px; color:#4a5568; margin:4px 0 2px;}
  .chart svg{width:100%; height:170px; display:block;}
  .loading{position:fixed; inset:0; background:rgba(255,255,255,.6);
    display:none; align-items:center; justify-content:center; font-size:15px; color:var(--muted);}
  .loading.on{display:flex;}
  .err{color:var(--accent); font-size:13px; margin:10px 0;}
  @media(max-width:1100px){ .charts{grid-template-columns:repeat(2,1fr); min-width:0;} }
</style>
</head>
<body>
  <div class="topbar">
    <button class="back-btn" onclick="location.reload()">← 返回列表</button>
    <div class="title">多连杆悬架运动学反向设计演示</div>
    <div class="spacer"></div>
    <a href="/predict.html" style="font-size:13px; color:#6b7686; text-decoration:none; margin-right:6px;">硬点手动输入预测 →</a>
    <div class="status" id="status">加载中…</div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <h2>模型设置</h2>
      <div class="ctrl">
        <label>假设的轮胎负载半径 [mm]
          <span class="help" title="模型在固定轮胎静力半径下训练（预设 352mm）。此处可调整仅用于工况标注，不改变神经网络的推理输出。">?</span>
        </label>
        <div class="val" id="tireVal">352</div>
        <input type="range" id="tire" min="300" max="380" step="1" value="352" />
      </div>
      <div class="ctrl">
        <label>轮跳扫描范围 [±mm]</label>
        <div class="val" id="rangeVal">50</div>
        <input type="range" id="range" min="10" max="50" step="1" value="50" />
      </div>
      <div class="ctrl">
        <label>扫描分辨率 [点数]</label>
        <div class="val" id="resVal">81</div>
        <input type="range" id="res" min="21" max="161" step="2" value="81" />
      </div>
      <div class="note">
        代理模型：33 个硬点坐标 + 轮心行程 → 8 条运动学曲线（前束/外倾/后倾/后倾拖距/主销偏移距/接地点XYZ）。
        曲线随「轮心行程 WCH」变化；设计位取 WCH=0。一阶目标值为设计位处沿行程的梯度（每米）。
      </div>
    </aside>

    <main class="main">
      <div class="setup-row">
        <select id="setup"></select>
      </div>
      <div id="err" class="err"></div>
      <div class="content">
        <div class="tables">
          <h3>设计位置的一阶目标值<br/>（Jounce）</h3>
          <table><thead><tr><th>目标量</th><th style="text-align:right">数值</th></tr></thead>
            <tbody id="jounce"></tbody></table>
          <h3>设计位置的转向目标值<br/>（Steering）</h3>
          <table><thead><tr><th>目标量</th><th style="text-align:right">数值</th></tr></thead>
            <tbody id="steering"></tbody></table>
        </div>
        <div class="charts" id="charts"></div>
      </div>
    </main>
  </div>

  <div class="loading" id="loading">推理中…</div>

<script>
const $ = (id) => document.getElementById(id);
let debounceTimer = null;

// ---------- 轻量 SVG 折线图（无外部依赖） ----------
function niceTicks(min, max, n = 4){
  if (min === max){ min -= 1; max += 1; }
  const span = max - min;
  const raw = span / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  let step = mag;
  if (norm >= 5) step = 5*mag; else if (norm >= 2) step = 2*mag; else step = mag;
  const start = Math.ceil(min/step)*step;
  const ticks = [];
  for (let v = start; v <= max + 1e-9; v += step) ticks.push(+v.toFixed(6));
  return ticks;
}

function drawChart(container, spec){
  const W = 260, H = 170, ml = 46, mr = 10, mt = 10, mb = 30;
  const x = spec.x, y = spec.y;
  const xmin = Math.min(...x), xmax = Math.max(...x);
  let ymin = Math.min(...y), ymax = Math.max(...y);
  if (ymin === ymax){ ymin -= 1; ymax += 1; }
  const pad = (ymax - ymin) * 0.08; ymin -= pad; ymax += pad;
  const px = v => ml + (v - xmin) / (xmax - xmin) * (W - ml - mr);
  const py = v => mt + (1 - (v - ymin) / (ymax - ymin)) * (H - mt - mb);

  const xt = niceTicks(xmin, xmax, 4), yt = niceTicks(ymin, ymax, 4);
  let g = '';
  // 网格 + 轴刻度
  yt.forEach(t => {
    if (t < ymin || t > ymax) return;
    const yy = py(t);
    g += `<line x1="${ml}" y1="${yy}" x2="${W-mr}" y2="${yy}" stroke="#eef1f6" stroke-width="1"/>`;
    g += `<text x="${ml-6}" y="${yy+3}" text-anchor="end" font-size="9" fill="#9aa4b2">${fmtTick(t)}</text>`;
  });
  xt.forEach(t => {
    if (t < xmin || t > xmax) return;
    const xx = px(t);
    g += `<text x="${xx}" y="${H-mb+13}" text-anchor="middle" font-size="9" fill="#9aa4b2">${fmtTick(t)}</text>`;
  });
  // 坐标轴
  g += `<line x1="${ml}" y1="${mt}" x2="${ml}" y2="${H-mb}" stroke="#c9d0da" stroke-width="1"/>`;
  g += `<line x1="${ml}" y1="${H-mb}" x2="${W-mr}" y2="${H-mb}" stroke="#c9d0da" stroke-width="1"/>`;
  // 折线
  let d = '';
  for (let i = 0; i < x.length; i++) d += (i ? 'L' : 'M') + px(x[i]).toFixed(1) + ' ' + py(y[i]).toFixed(1) + ' ';
  g += `<path d="${d}" fill="none" stroke="${spec.color}" stroke-width="2.2" stroke-linejoin="round"/>`;
  // 轴标题
  g += `<text x="${(ml+W-mr)/2}" y="${H-4}" text-anchor="middle" font-size="9.5" fill="#6b7686">WCH [mm]</text>`;
  g += `<text x="12" y="${(mt+H-mb)/2}" text-anchor="middle" font-size="9.5" fill="#6b7686" transform="rotate(-90 12 ${(mt+H-mb)/2})">${spec.unit}</text>`;

  const div = document.createElement('div');
  div.className = 'chart';
  div.innerHTML = `<div class="ct">${spec.title}</div>`
    + `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
  container.appendChild(div);
}

function fmtTick(v){
  const a = Math.abs(v);
  if (a !== 0 && (a < 0.01 || a >= 10000)) return v.toExponential(1);
  if (a >= 100) return v.toFixed(0);
  if (a >= 1) return v.toFixed(1);
  return v.toFixed(2);
}
function fmtVal(v){
  const a = Math.abs(v);
  if (a >= 100) return v.toFixed(2);
  return v.toFixed(3);
}

// ---------- 数据流 ----------
async function loadSetups(){
  const r = await fetch('/api/setups');
  const data = await r.json();
  const sel = $('setup');
  sel.innerHTML = '';
  data.setups.forEach((s, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = s.name; sel.appendChild(o);
  });
  const tr = (data.presets && data.presets.tire_static_radius_mm) || 352;
  $('tire').value = tr; $('tireVal').textContent = tr;
}

async function infer(){
  $('err').textContent = '';
  $('loading').classList.add('on');
  try{
    const body = {
      setup: +$('setup').value,
      scan_range: +$('range').value,
      resolution: +$('res').value,
      tire_radius: +$('tire').value,
    };
    const r = await fetch('/api/infer', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const data = await r.json();
    if (data.error){ $('err').textContent = '推理失败：' + data.error; return; }
    render(data);
    $('status').textContent = `就绪 · ${data.stroke.length} 点 · WCH ±${data.meta.scan_range}mm`;
  }catch(e){
    $('err').textContent = '请求失败：' + e.message;
  }finally{
    $('loading').classList.remove('on');
  }
}

function render(data){
  // 表格
  const jt = $('jounce'); jt.innerHTML = '';
  data.jounce.forEach(row => {
    jt.innerHTML += `<tr><td class="name">${row.label}</td><td class="value">${fmtVal(row.value)}</td></tr>`;
  });
  const st = $('steering'); st.innerHTML = '';
  data.steering.forEach(row => {
    st.innerHTML += `<tr><td class="name">${row.label}</td><td class="value">${fmtVal(row.value)}</td></tr>`;
  });
  // 图
  const c = $('charts'); c.innerHTML = '';
  data.curves.forEach(spec => drawChart(c, spec));
}

function scheduleInfer(){
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(infer, 180);
}

function bind(){
  $('setup').addEventListener('change', infer);
  $('range').addEventListener('input', () => { $('rangeVal').textContent = $('range').value; scheduleInfer(); });
  $('res').addEventListener('input',   () => { $('resVal').textContent   = $('res').value;   scheduleInfer(); });
  $('tire').addEventListener('input',  () => { $('tireVal').textContent  = $('tire').value;  });
}

(async function init(){
  try{
    await loadSetups();
    bind();
    await infer();
  }catch(e){
    $('status').textContent = '初始化失败';
    $('err').textContent = e.message;
  }
})();
</script>
</body>
</html>
